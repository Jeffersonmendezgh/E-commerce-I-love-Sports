{% extends  "base.html" %}

{% block content %}
<div class="col" >
    {% if product.image %}

    <img src="{{product.image.url}}" alt="imagen de chaqueta" width="200" height="200">

    {% endif %}
    <div class="h1">{{product.title}}</div>
    <div class="h5 font-weight-bold">
        Precio: <span class="text-danger">${{product.price}}</span>
    </div>
    <div class="alert alert-info">
    <strong>{{product.description}}</strong>
    <div>
        {% include 'carts/snippets/add.html' %}
    </div>
    </div>
</div>
{% endblock %}
