{% load static %}

<div class="card h-100 text-white bg-success mb-3" style="max-width: 18rem;">
            {% if i.image  %}
            <img src="{{i.image.url}}" alt="chaqueta"  >
            {% endif %}
            <div class="card-body">
                <h5 class="card-text">{{i.title}}</h5>
                <p class="card-text">{{i.description}}</p>
            <a style="background-color: green;" href="{% url 'product' i.slug %}" class="btn btn-primary">detalles</a>
            </div>
</div>
