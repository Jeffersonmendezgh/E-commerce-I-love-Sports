<form action="{% url 'add' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="product_id" value="{{ product.id }}">
   <div><!--funcion para agregar cantidad al carrito-->
    <button type="button" class="btn btn-danger d-inline" id="remove">-</button>
    <input type="number" value="1" class="form-control-1 col-sm-1 d-inline" id="quantity" name="quantity" readonly><!--readonli no permite que el usuario cambie valores del input-->
    <button type="button" class="btn btn-danger d-inline" id="add">+</button>
   </div>
   <div class="mt-2">
    <button type="submit" class="btn btn-warning">Agregar al carrito</button>
</div>
</form>

<script>
    const add = document.getElementById("add");
    const remove = document.getElementById("remove");
    const quantity = document.getElementById("quantity");
    //funcion para sumar
    add.addEventListener("click", function(){
        quantity.value = parseInt(quantity.value) + 1
    })

    //fyuncion para restar
    remove.addEventListener("click", function(){
        value = parseInt(quantity.value)
        if(value != 1){
            value = value -1
        }
        quantity.value = value
    })
</script>
